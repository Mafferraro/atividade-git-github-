 
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mensagem</title>
</head>
<body>
    <h1>Mensagem interativa</h1>
 
    <button onclick="mostrarMensagem()">Clique aqui</button>
    <p id="mensagem"></p>
 
    <script>
        function mostrarMensagem() {
            document.getElementById("mensagem").textContent =
                "JavaScript está funcionando!";
        }
    </script>
</body>
</html>
